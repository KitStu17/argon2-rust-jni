plugins {
    id 'java-library'
    id 'maven-publish'
    id 'signing'
}

group = 'io.github.kitstu17'
version = '0.1.1'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.24.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    main {
        java {
            srcDirs = ['java/src/main/java']
        }
        resources {
            srcDirs = ['java/src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['java/src/test/java']
        }
    }
}

// Javadoc 옵션
tasks.named('javadoc') {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

// 의존성 명시
tasks.named('processResources') {
    dependsOn tasks.named('copyNatives')
}

tasks.named('sourcesJar') {
    dependsOn tasks.named('processResources')
}

tasks.named('jar') {
    mustRunAfter tasks.named('copyNatives')
}

tasks.named('test') {
    useJUnitPlatform()
    
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        showStandardStreams = true
        showExceptions = true
        showCauses = true
        showStackTraces = true
        exceptionFormat = "full"
        
        afterSuite { desc, result ->
            if (!desc.parent) {
                println "\n========================================="
                println "Test Summary"
                println "========================================="
                println "Total:   ${result.testCount}"
                println "Passed:  ${result.successfulTestCount}"
                println "Failed:  ${result.failedTestCount}"
                println "Skipped: ${result.skippedTestCount}"
                println "Time:    ${(result.endTime - result.startTime) / 1000.0}s"
                println "=========================================\n"
            }
        }
    }
}

// Rust 빌드 태스크
tasks.register('buildRust', Exec) {
    description = 'Build Rust library'
    group = 'build'
    
    workingDir = file('rust')
    
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'cargo', 'build', '--release'
    } else {
        commandLine 'cargo', 'build', '--release'
    }
}

// 네이티브 라이브러리 복사
tasks.register('copyNatives', Copy) {
    description = 'Copy native libraries to resources'
    group = 'build'
    
    dependsOn tasks.named('buildRust')
    
    from('rust/target/release') {
        include '*.dll', '*.so', '*.dylib'
    }
    
    into 'java/src/main/resources/natives/' + getOsPlatform()
    
    doFirst {
        def targetDir = file("java/src/main/resources/natives/${getOsPlatform()}")
        targetDir.mkdirs()
    }
}

def getOsPlatform() {
    def osName = System.getProperty('os.name').toLowerCase()
    def osArch = System.getProperty('os.arch').toLowerCase()
    
    if (osName.contains('windows')) {
        return 'windows-x86-64'
    } else if (osName.contains('linux')) {
        if (osArch.contains('aarch64') || osArch.contains('arm64')) {
            return 'linux-aarch64'
        }
        return 'linux-x86-64'
    } else if (osName.contains('mac')) {
        if (osArch.contains('aarch64') || osArch.contains('arm64')) {
            return 'darwin-aarch64'
        }
        return 'darwin-x86-64'
    }
    throw new GradleException("Unsupported OS: ${osName} ${osArch}")
}

tasks.named('build') {
    mustRunAfter tasks.named('copyNatives')
}

// 릴리스 빌드용 (모든 플랫폼 라이브러리 포함)
tasks.register('buildForRelease') {
    description = 'Build with all platform native libraries'
    group = 'build'
    
    dependsOn 'copyAllNatives', 'build'
}

tasks.register('copyAllNatives', Copy) {
    description = 'Copy all platform native libraries'
    group = 'build'
    
    from('natives-prebuilt') {
        include '**/*.dll', '**/*.so', '**/*.dylib'
    }
    into 'java/src/main/resources/natives'
}

// Maven Publishing 설정
publishing {
    publications {
        maven(MavenPublication) {
            from components.java
            
            groupId = 'io.github.kitstu17'
            artifactId = 'argon2-rust-jni'
            version = '0.1.1'
            
            pom {
                name = 'Argon2 Rust JNI'
                description = 'High-performance, memory-safe Argon2 password hashing library for Java/Spring Boot, powered by Rust'
                url = 'https://github.com/kitstu17/argon2-rust-jni'
                
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                
                developers {
                    developer {
                        id = 'kitstu17'
                        name = 'kitstu17'
                        url = 'https://github.com/kitstu17'
                    }
                }
                
                scm {
                    connection = 'scm:git:git://github.com/kitstu17/argon2-rust-jni.git'
                    developerConnection = 'scm:git:ssh://git@github.com/kitstu17/argon2-rust-jni.git'
                    url = 'https://github.com/kitstu17/argon2-rust-jni'
                }
            }
        }
    }
    
    repositories {
        maven {
            name = "CentralPortal"
            
            // AUTOMATIC: 자동으로 Maven Central에 배포
            // USER_MANAGED: 수동으로 Central Portal에서 승인 필요
            def publishingType = version.endsWith('-SNAPSHOT') ? 'USER_MANAGED' : 'AUTOMATIC'
            url = uri("https://central.sonatype.com/api/v1/publisher/upload?name=${project.group}:${project.name}:${project.version}&publishingType=${publishingType}")
            
            credentials {
                username = project.findProperty("centralPortalUsername") ?: System.getenv("CENTRAL_PORTAL_USERNAME")
                password = project.findProperty("centralPortalToken") ?: System.getenv("CENTRAL_PORTAL_TOKEN")
            }
        }
    }
}

// Signing 설정
signing {
    // 로컬 테스트: 파일에서 읽기
    def keyFile = file('gpg-private-key.asc')
    if (keyFile.exists()) {
        def signingKey = keyFile.text
        def signingPassword = project.findProperty("signingPassword") ?: System.getenv("GPG_PASSWORD")
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.maven
    } else {
        // CI/CD: 환경변수에서 읽기
        def signingKey = project.findProperty("signingKey") ?: System.getenv("GPG_PRIVATE_KEY")
        def signingPassword = project.findProperty("signingPassword") ?: System.getenv("GPG_PASSWORD")
        
        if (signingKey && signingPassword) {
            useInMemoryPgpKeys(signingKey, signingPassword)
            sign publishing.publications.maven
        }
    }
}