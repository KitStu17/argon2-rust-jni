plugins {
    id 'java-library'
    id 'signing'
    id 'com.vanniktech.maven.publish' version '0.30.0'
}

group = 'io.github.kitstu17'
version = '0.1.2'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core:3.24.2'
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
    
    withSourcesJar()
    withJavadocJar()
}

sourceSets {
    main {
        java {
            srcDirs = ['java/src/main/java']
        }
        resources {
            srcDirs = ['java/src/main/resources']
        }
    }
    test {
        java {
            srcDirs = ['java/src/test/java']
        }
    }
}

// Javadoc 옵션
tasks.named('javadoc') {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
}

// 의존성 명시
tasks.named('processResources') {
    dependsOn tasks.named('copyNatives')
}

tasks.named('sourcesJar') {
    dependsOn tasks.named('processResources')
}

tasks.named('jar') {
    mustRunAfter tasks.named('copyNatives')
}

tasks.named('test') {
    useJUnitPlatform()
    
    testLogging {
        events "passed", "skipped", "failed", "standardOut", "standardError"
        showStandardStreams = true
        showExceptions = true
        showCauses = true
        showStackTraces = true
        exceptionFormat = "full"
        
        afterSuite { desc, result ->
            if (!desc.parent) {
                println "\n========================================="
                println "Test Summary"
                println "========================================="
                println "Total:   ${result.testCount}"
                println "Passed:  ${result.successfulTestCount}"
                println "Failed:  ${result.failedTestCount}"
                println "Skipped: ${result.skippedTestCount}"
                println "Time:    ${(result.endTime - result.startTime) / 1000.0}s"
                println "=========================================\n"
            }
        }
    }
}

// Rust 빌드 태스크
tasks.register('buildRust', Exec) {
    description = 'Build Rust library'
    group = 'build'
    
    workingDir = file('rust')
    
    if (System.getProperty('os.name').toLowerCase().contains('windows')) {
        commandLine 'cmd', '/c', 'cargo', 'build', '--release'
    } else {
        commandLine 'cargo', 'build', '--release'
    }
}

// 네이티브 라이브러리 복사
tasks.register('copyNatives', Copy) {
    description = 'Copy native libraries to resources'
    group = 'build'
    
    dependsOn tasks.named('buildRust')
    
    from('rust/target/release') {
        include '*.dll', '*.so', '*.dylib'
    }
    
    into 'java/src/main/resources/natives/' + getOsPlatform()
    
    doFirst {
        def targetDir = file("java/src/main/resources/natives/${getOsPlatform()}")
        targetDir.mkdirs()
    }
}

def getOsPlatform() {
    def osName = System.getProperty('os.name').toLowerCase()
    def osArch = System.getProperty('os.arch').toLowerCase()
    
    if (osName.contains('windows')) {
        return 'windows-x86-64'
    } else if (osName.contains('linux')) {
        if (osArch.contains('aarch64') || osArch.contains('arm64')) {
            return 'linux-aarch64'
        }
        return 'linux-x86-64'
    } else if (osName.contains('mac')) {
        if (osArch.contains('aarch64') || osArch.contains('arm64')) {
            return 'darwin-aarch64'
        }
        return 'darwin-x86-64'
    }
    throw new GradleException("Unsupported OS: ${osName} ${osArch}")
}

tasks.named('build') {
    mustRunAfter tasks.named('copyNatives')
}

// 릴리스 빌드용 (모든 플랫폼 라이브러리 포함)
tasks.register('buildForRelease') {
    description = 'Build with all platform native libraries'
    group = 'build'
    
    dependsOn 'copyAllNatives', 'build'
}

tasks.register('copyAllNatives', Copy) {
    description = 'Copy all platform native libraries'
    group = 'build'
    
    from('natives-prebuilt') {
        include '**/*.dll', '**/*.so', '**/*.dylib'
    }
    into 'java/src/main/resources/natives'
}

// Maven Publishing 설정 (vanniktech plugin)
mavenPublishing {
    publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL, true)
    signAllPublications()

    coordinates("io.github.kitstu17", "argon2-rust-jni", "0.1.2")

    pom {
        name = 'Argon2 Rust JNI'
        description = 'High-performance, memory-safe Argon2 password hashing library for Java/Spring Boot, powered by Rust'
        url = 'https://github.com/kitstu17/argon2-rust-jni'
        inceptionYear = '2025'

        licenses {
            license {
                name = 'The Apache License, Version 2.0'
                url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                distribution = 'repo'
            }
        }

        developers {
            developer {
                id = 'kitstu17'
                name = 'kitstu17'
                url = 'https://github.com/kitstu17'
            }
        }

        scm {
            connection = 'scm:git:git://github.com/kitstu17/argon2-rust-jni.git'
            developerConnection = 'scm:git:ssh://git@github.com/kitstu17/argon2-rust-jni.git'
            url = 'https://github.com/kitstu17/argon2-rust-jni'
        }
    }
}

// Signing 설정 (vanniktech plugin과 함께 사용)
signing {
    def signingKey = null
    def signingPassword = null

    // 1순위: 로컬 GPG 키 파일 (gpg-private-key.asc)
    def keyFile = file('gpg-private-key.asc')
    if (keyFile.exists()) {
        println "Using GPG key from file: gpg-private-key.asc"
        signingKey = keyFile.text
        signingPassword = project.findProperty("signing.password") ?: System.getenv("GPG_PASSWORD")
    }
    // 2순위: gradle.properties의 signing.key 또는 환경변수
    else {
        signingKey = project.findProperty("signing.key") ?: System.getenv("GPG_PRIVATE_KEY")
        signingPassword = project.findProperty("signing.password") ?: System.getenv("GPG_PASSWORD")

        if (signingKey) {
            println "Using GPG key from properties/environment"
        }
    }

    // GPG 키가 있으면 in-memory 방식으로 서명 설정
    if (signingKey && signingPassword) {
        useInMemoryPgpKeys(signingKey, signingPassword)
    } else {
        println "WARNING: GPG signing not configured. Publications will not be signed."
        println "  - For local: Create gpg-private-key.asc file or set signing.key/signing.password in gradle.properties"
        println "  - For CI/CD: Set GPG_PRIVATE_KEY and GPG_PASSWORD environment variables"
    }
}